<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}">Pokémon Predictor</a>
        <a href="{{ url_for('predict') }}">New Prediction</a>
    </nav>

    <main class="container">
        <section class="result-card card">
            <span class="eyebrow">Model Prediction</span>
            <h1>Predicted Pokémon Type</h1>

            <div class="predicted-type">
                {{ pokemon_type }}
            </div>

            <div class="actions">
                <a class="button button-primary"
                   href="{{ url_for('predict') }}">
                    Predict Another
                </a>
                <a class="button button-secondary"
                   href="{{ url_for('home') }}">
                    Back to Home
                </a>
            </div>
        </section>
    </main>
</body>
</html>
