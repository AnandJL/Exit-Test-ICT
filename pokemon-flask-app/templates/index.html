<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Type Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}">Pokémon Predictor</a>
        <a href="{{ url_for('predict') }}">Start Prediction</a>
    </nav>

    <main class="container">
        <section class="hero card">
            <div class="hero-content">
                <span class="eyebrow">Machine Learning Project</span>
                <h1>Predict a Pokémon Type</h1>
                <p>
                    Enter a Pokémon's combat and physical statistics to estimate
                    its primary type using the trained machine-learning model.
                </p>
                <a class="button button-primary"
                   href="{{ url_for('predict') }}">
                    Make a Prediction
                </a>
            </div>

            <div class="hero-stat">
                <strong>18</strong>
                <span>Pokémon Types</span>
            </div>
        </section>
    </main>
</body>
</html>
